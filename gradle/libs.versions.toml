[versions]
# Build / language
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.9"
composeBom = "2026.05.01"
coroutines = "1.11.0"

# AndroidX — pinned to the SDK-36 generation (newer releases require compileSdk 37).
coreKtx = "1.17.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
# Splash screen on every API level via the compat theme (Core SplashScreen API).
coreSplashscreen = "1.2.0"

# Navigation 3 (Compose-native; the back stack is a plain observable list owned by the app).
# The per-entry ViewModel decorator ships with lifecycle (lifecycle-viewmodel-navigation3).
navigation3 = "1.1.2"
# Chrome Custom Tabs for opening article source URLs.
browser = "1.10.0"

# DI (androidxHilt covers the AndroidX hilt-* companions, e.g. hiltViewModel() for Compose)
hilt = "2.59.2"
androidxHilt = "1.3.0"

# Images — Coil 3.5.0 is compiled with Kotlin 2.4, whose metadata Hilt cannot read yet
# (same blocker as the Kotlin 2.4 upgrade itself); 3.4.0 is the newest Kotlin-2.3 build.
coil = "3.4.0"

# Compose stability: immutable collections carried by UiState so list params are skippable.
kotlinxCollectionsImmutable = "0.5.0"

# Performance: Macrobenchmark + Baseline Profile generation on Gradle Managed Devices.
# 1.5.0-alpha is required for AGP 9 (1.4.x rejects AGP 9 application modules).
benchmark = "1.5.0-alpha06"
profileinstaller = "1.4.1"
uiautomator = "2.3.0"
androidxTestExtJunit = "1.3.0"

# GraphQL client (Apollo Kotlin). The normalized cache, scalar adapters and mock server
# live in their own repositories and are versioned independently of the main artifacts.
apollo = "5.0.0"
apolloNormalizedCache = "1.0.3"
apolloAdapters = "0.7.0"
apolloMockserver = "0.3.1"

# BFF (Ktor + graphql-kotlin) — Ktor pinned to the version graphql-kotlin 10 ships with.
ktor = "3.4.1"
graphqlKotlin = "10.0.0"
kotlinxSerialization = "1.9.0"
logback = "1.5.18"

# Quality / coverage
detekt = "1.23.8"
ktlint = "14.2.0"
kover = "0.9.8"

# Testing (referenced from later stages)
junit = "6.1.0"
junit4 = "4.13.2"
mockk = "1.14.11"
turbine = "1.2.1"
robolectric = "4.16.1"
roborazzi = "1.64.0"

# SDK levels
minSdk = "26"
targetSdk = "36"
compileSdk = "36"

[libraries]
# Used in the build classpath to pin the Kotlin version over AGP's built-in Kotlin.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

# Navigation 3
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

# Chrome Custom Tabs
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }

# Compose (versions come from the BOM)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
# currentWindowAdaptiveInfo() — the WindowSizeClass behind the adaptive list-detail layout.
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Immutable collections (pure Kotlin; the Compose compiler treats them as stable)
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }

# Performance (Macrobenchmark, Baseline Profiles)
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# DI
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
# hiltViewModel() for Compose (hilt-navigation-compose's hiltViewModel moved here).
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }

# GraphQL client (Apollo Kotlin 5 + companion libraries)
apollo-runtime = { module = "com.apollographql.apollo:apollo-runtime", version.ref = "apollo" }
apollo-api = { module = "com.apollographql.apollo:apollo-api", version.ref = "apollo" }
apollo-normalized-cache-sqlite = { module = "com.apollographql.cache:normalized-cache-sqlite", version.ref = "apolloNormalizedCache" }
apollo-adapters-core = { module = "com.apollographql.adapters:apollo-adapters-core", version.ref = "apolloAdapters" }
apollo-mockserver = { module = "com.apollographql.mockserver:apollo-mockserver", version.ref = "apolloMockserver" }

# Images (Coil 3 — compose integration plus the OkHttp network fetcher for http(s) URLs)
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# Testing (wired into the catalog now, used from later stages)
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
# Runs JUnit 4 tests (Robolectric) on the JUnit Platform next to Jupiter tests.
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }

# BFF (Ktor + graphql-kotlin). Ktor artifacts share the single `ktor` version.
graphql-kotlin-ktor-server = { module = "com.expediagroup:graphql-kotlin-ktor-server", version.ref = "graphqlKotlin" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# Runtime for @Serializable NavKeys (rememberNavBackStack persists them across process death).
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Detekt formatting ruleset (ktlint-based), used by the detekt plugin.
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# Self-instrumenting test module type used by :benchmark.
android-test = { id = "com.android.test", version.ref = "agp" }
# Generates baseline-prof.txt from the :benchmark generator and wires it into :app's release.
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
apollo = { id = "com.apollographql.apollo", version.ref = "apollo" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
