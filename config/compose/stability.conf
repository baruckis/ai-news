// Compose compiler stability configuration.
//
// :core:model is a pure Kotlin/JVM module that, by design, depends on nothing — so its
// classes cannot carry @Immutable (a Compose runtime annotation). This file tells the
// Compose compiler they are immutable anyway, keeping composables that take them as
// parameters (e.g. NewsCard) skippable without breaking the module dependency rules.
com.baruckis.ainews.core.model.*
// java.time.Instant is immutable but lives outside the compilation unit, so the compiler
// would otherwise infer it (and every class carrying it) as unstable.
java.time.Instant
